version: "3.8"

services:
    postgres:
        image: postgres:16-alpine
        container_name: iris_postgres
        restart: unless-stopped
        ports:
            - "${DB_PORT:-5432}:5432"
        environment:
            POSTGRES_DB: "${DB_DATABASE:-iris_db}"
            POSTGRES_USER: "${DB_USERNAME:-root}"
            POSTGRES_PASSWORD: "${DB_PASSWORD:-89928234472747237}"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${DB_USERNAME:-root} -d ${DB_DATABASE:-iris_db}",
                ]
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis:alpine
        container_name: iris_redis
        restart: unless-stopped
        ports:
            - "${REDIS_PORT:-6379}:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
        driver: local
    redis_data:
        driver: local
